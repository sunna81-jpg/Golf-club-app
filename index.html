<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>P1 Golf Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#122E26;
    --green-deep2:#1E4739;
    --green-mid:#2F6F52;
    --green-mid-hover:#286048;
    --green-soft:#E1EBE1;
    --paper:#F5F0E2;
    --paper-card:#FFFEFA;
    --sand:#C89B5C;
    --sand-bg:#F4E4C4;
    --flag:#AD382E;
    --ink:#20241C;
    --ink-soft:#6D6C5D;
    --border:#E7DFC9;
    --silver-bg:#E9E6DC;
    --bronze-bg:#EDD4BE;
    --wood-1:#7C4F28;
    --wood-2:#5E3A1D;
    --wood-3:#96683A;
    --shadow-1:0 1px 2px rgba(30,40,25,0.04), 0 2px 8px rgba(30,40,25,0.05);
    --shadow-2:0 2px 6px rgba(30,40,25,0.06), 0 8px 20px rgba(30,40,25,0.07);
    --shadow-header:0 6px 20px rgba(10,30,22,0.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#DCD5BE;
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app-frame{
    max-width:440px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    padding-bottom:86px;
    position:relative;
  }

  .splash-screen{
    position:fixed; inset:0; z-index:1000;
    max-width:440px; margin:0 auto;
    background:#06140F;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    overflow:hidden;
    cursor:pointer;
    transition:opacity .55s ease, visibility .55s ease;
  }
  .splash-screen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .splash-photo{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center 22%;
    transform:scale(1.08);
    animation:kenBurns 7s ease-out forwards;
  }
  @keyframes kenBurns{ 0%{ transform:scale(1.08); } 100%{ transform:scale(1); } }
  .splash-scrim-top{
    position:absolute; top:0; left:0; right:0; height:30%;
    background:linear-gradient(180deg, rgba(6,20,15,0.6) 0%, rgba(6,20,15,0) 100%);
  }
  .splash-scrim-bottom{
    position:absolute; bottom:0; left:0; right:0; height:52%;
    background:linear-gradient(0deg, rgba(6,20,15,0.92) 0%, rgba(6,20,15,0.45) 55%, rgba(6,20,15,0) 100%);
  }
  .splash-content{
    position:relative; z-index:2;
    width:100%;
    text-align:center;
    padding-bottom:46px;
  }
  .impact-flash{
    position:absolute; left:66%; top:56%; width:90px; height:90px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,250,225,0.95) 0%, rgba(255,220,150,0.35) 45%, transparent 75%);
    border-radius:50%;
    opacity:0;
    animation:impactFlash 1.4s ease-out forwards;
    pointer-events:none;
    z-index:2;
  }
  @keyframes impactFlash{
    0%,18%{opacity:0; transform:translate(-50%,-50%) scale(0.6);}
    30%{opacity:0.9; transform:translate(-50%,-50%) scale(1.15);}
    50%{opacity:0;}
    100%{opacity:0;}
  }
  .splash-spark{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--sand) 55%, transparent 100%);
    opacity:0; z-index:4;
    animation:splashSparkOut 1.9s ease-out forwards;
  }
  @keyframes splashSparkOut{
    0%,55%{opacity:0; transform:translate(0,0) scale(0.3);}
    60%{opacity:1;}
    100%{opacity:0; transform:translate(var(--dx), var(--dy)) scale(1);}
  }
  .splash-title{
    font-family:'Oswald', sans-serif;
    font-size:40px;
    font-weight:700;
    letter-spacing:2px;
    color:#fff;
    text-shadow:0 3px 18px rgba(0,0,0,0.5), 0 0 30px rgba(200,155,92,0.25);
    margin:0 0 4px;
    opacity:0;
    transform:scale(0.86) translateY(10px);
    animation:titleIn 0.9s cubic-bezier(.2,.8,.2,1) 0.7s forwards;
    position:relative;
    z-index:2;
  }
  @keyframes titleIn{ to{ opacity:1; transform:scale(1) translateY(0); } }
  .splash-subtitle{
    font-family:'Oswald', sans-serif;
    font-size:13px;
    font-weight:500;
    letter-spacing:4px;
    color:var(--sand);
    text-transform:uppercase;
    opacity:0;
    animation:fadeUp .7s ease 1.15s forwards;
    position:relative; z-index:2;
  }
  .splash-tap{
    margin-top:38px;
    font-size:12px;
    color:rgba(255,255,255,0.55);
    letter-spacing:1px;
    opacity:0;
    animation:fadeUp .6s ease 1.6s forwards, tapPulse 1.6s ease-in-out 1.7s infinite;
    position:relative; z-index:2;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes tapPulse{ 0%,100%{opacity:0.4;} 50%{opacity:0.9;} }

  .app-header{
    background:linear-gradient(155deg, var(--green-deep) 0%, var(--green-deep2) 100%);
    color:#fff;
    padding:20px 20px 16px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:var(--shadow-header);
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:'Oswald', sans-serif;
    font-size:20px;
    font-weight:600;
    letter-spacing:0.1px;
    position:relative;
    overflow:hidden;
  }
  .brand::after{
    content:'';
    position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    transform:skewX(-20deg);
    animation:brandShine 5s ease-in-out infinite;
  }
  @keyframes brandShine{ 0%{left:-60%;} 20%{left:135%;} 100%{left:135%;} }
  .brand svg{flex-shrink:0;}
  .icon-btn{
    background:none;
    border:none;
    color:#CFE0D3;
    padding:6px;
    cursor:pointer;
    display:flex;
    border-radius:8px;
    transition:background .15s ease;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.08);}
  .subtitle{
    font-size:11.5px;
    color:#9FBFAC;
    margin:3px 0 14px 29px;
    letter-spacing:0.6px;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
  }
  .identity-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.16);
    color:#fff;
    border-radius:24px;
    padding:5px 14px 5px 5px;
    font-size:13px;
    cursor:pointer;
    transition:background .15s ease;
    position:relative;
    overflow:hidden;
  }
  .identity-chip:hover{background:rgba(255,255,255,0.16);}
  .identity-chip b{font-weight:600;}

  .stone-divider{
    height:7px;
    background:
      repeating-linear-gradient(90deg, #B9B4A6 0 13px, #A39D8C 13px 15px, #CAC5B4 15px 28px, #96907C 28px 30px);
    box-shadow:inset 0 2px 3px rgba(0,0,0,0.28), inset 0 -1px 1px rgba(255,255,255,0.15);
  }

  .tab-content{
    padding:18px 16px 8px;
  }
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:4px 0 14px;
  }
  .section-head h2{
    font-family:'Oswald', sans-serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.2px;
    margin:0;
    color:var(--green-deep);
  }
  .add-btn{
    background:var(--green-mid);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:9px 14px;
    font-size:13px;
    font-weight:500;
    font-family:'Noto Sans KR',sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
    box-shadow:0 3px 10px rgba(47,111,82,0.24);
    transition:background .15s ease, transform .1s ease;
    position:relative;
    overflow:hidden;
  }
  .add-btn:hover{background:var(--green-mid-hover);}
  .add-btn:active{transform:scale(0.97);}
  .divider-label{
    font-size:12px;
    color:var(--ink-soft);
    margin:20px 0 10px 2px;
    display:flex;
    align-items:center;
    gap:8px;
    letter-spacing:0.2px;
  }
  .divider-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--border);
  }
  .card{
    background:var(--paper-card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px 17px;
    margin-bottom:11px;
    cursor:pointer;
    box-shadow:var(--shadow-1);
    transition:box-shadow .15s ease, transform .1s ease;
    position:relative;
    overflow:hidden;
  }
  .card:hover{box-shadow:var(--shadow-2);}
  .card:active{transform:scale(0.99);}
  .card.past{opacity:0.62;}
  .card-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .event-date{
    font-family:'Roboto Mono', monospace;
    font-size:12px;
    color:var(--green-mid);
    font-weight:600;
    background:var(--green-soft);
    display:inline-block;
    padding:3px 9px;
    border-radius:7px;
    margin-bottom:7px;
    letter-spacing:0.2px;
  }
  .event-course{
    font-size:15.5px;
    font-weight:500;
    margin:0 0 3px;
    letter-spacing:-0.1px;
  }
  .event-meta{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .badge{
    font-size:11px;
    padding:4px 10px;
    border-radius:20px;
    font-weight:500;
    white-space:nowrap;
  }
  .badge-open{background:var(--green-soft); color:var(--green-mid);}
  .badge-done{background:#EEE9D9; color:var(--ink-soft);}
  .empty-state{
    text-align:center;
    padding:56px 20px;
    color:var(--ink-soft);
  }
  .empty-state svg{opacity:0.45; margin-bottom:12px;}
  .empty-state p{font-size:14px; margin:0 0 18px; line-height:1.6;}
  .rank-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper-card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:13px 15px;
    margin-bottom:10px;
    box-shadow:var(--shadow-1);
    position:relative;
    overflow:hidden;
  }
  .rank-badge{
    width:28px;
    height:28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    flex-shrink:0;
    background:#EEE9D9;
    color:var(--ink-soft);
  }
  .rank-1{background:var(--sand-bg); color:#7A551C; animation:goldPulse 2.2s ease-in-out infinite;}
  @keyframes goldPulse{
    0%,100%{box-shadow:0 0 0 2px rgba(200,155,92,0.25);}
    50%{box-shadow:0 0 0 5px rgba(200,155,92,0.15);}
  }
  .rank-2{background:var(--silver-bg); color:#4E4C43;}
  .rank-3{background:var(--bronze-bg); color:#7A4423;}
  .rank-info{flex:1; min-width:0;}
  .rank-name{font-size:15px; font-weight:500; margin:0 0 3px; letter-spacing:-0.1px;}
  .rank-stats{font-size:11.5px; color:var(--ink-soft); font-family:'Roboto Mono',monospace;}
  .rank-hcp{
    text-align:right;
    flex-shrink:0;
  }
  .rank-hcp .num{font-family:'Roboto Mono',monospace; font-size:17px; font-weight:600; color:var(--green-deep);}
  .rank-hcp .lbl{font-size:10px; color:var(--ink-soft);}
  .note-box{
    font-size:12.5px;
    color:var(--green-deep);
    background:var(--green-soft);
    border-radius:12px;
    padding:11px 13px;
    margin-bottom:16px;
    line-height:1.55;
  }
  .segmented{
    display:flex;
    background:var(--green-soft);
    border-radius:13px;
    padding:4px;
    gap:4px;
    margin-bottom:16px;
  }
  .seg-btn{
    flex:1;
    border:none;
    background:none;
    padding:9px 6px;
    border-radius:10px;
    font-size:13px;
    font-family:'Noto Sans KR',sans-serif;
    color:var(--green-deep);
    cursor:pointer;
  }
  .seg-btn.active{
    background:var(--paper-card);
    font-weight:500;
    box-shadow:var(--shadow-1);
  }
  .hof-card{
    background:var(--paper-card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow-1);
  }
  .hof-title{
    font-family:'Oswald',sans-serif;
    font-size:14.5px;
    font-weight:600;
    color:var(--green-deep);
    letter-spacing:0.1px;
  }
  .hof-sub{
    font-size:11px;
    font-weight:400;
    color:var(--ink-soft);
    margin-left:7px;
    font-family:'Noto Sans KR',sans-serif;
    letter-spacing:0;
  }
  .ach-chip{
    border:1px solid var(--border);
    background:#fff;
    color:var(--ink-soft);
    border-radius:14px;
    padding:5px 10px;
    font-size:11.5px;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    flex-shrink:0;
  }
  .ach-chip.active{
    background:var(--sand-bg);
    border-color:var(--sand);
    color:#7A551C;
    font-weight:500;
  }
  .member-row{
    display:flex;
    align-items:center;
    gap:13px;
    background:var(--paper-card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:13px 15px;
    margin-bottom:10px;
    box-shadow:var(--shadow-1);
    cursor:pointer;
    transition:box-shadow .15s ease;
    position:relative;
    overflow:hidden;
  }
  .member-row:hover{box-shadow:var(--shadow-2);}
  .post-card .post-title{font-size:15.5px; font-weight:500; margin:0 0 5px; letter-spacing:-0.1px;}
  .post-meta{font-size:11.5px; color:var(--ink-soft); margin-bottom:7px; display:flex; align-items:center; gap:6px;}
  .post-preview{font-size:13px; color:var(--ink-soft); line-height:1.55;}

  .bottom-nav{
    position:fixed;
    bottom:0; left:0; right:0;
    max-width:440px;
    margin:0 auto;
    background:
      repeating-linear-gradient(97deg, var(--wood-1) 0 4px, var(--wood-3) 4px 7px, var(--wood-2) 7px 11px);
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.35), 0 -6px 20px rgba(15,20,12,0.3);
    border-top:2px solid rgba(0,0,0,0.25);
    display:flex;
    z-index:20;
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    padding:11px 4px 9px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:rgba(255,246,230,0.78);
    font-size:11px;
    font-family:'Noto Sans KR',sans-serif;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    text-shadow:0 1px 2px rgba(0,0,0,0.35);
  }
  .nav-btn.active{color:#fff; font-weight:500;}
  .nav-btn.active::after{
    content:'';
    display:block;
    width:16px;
    height:2.5px;
    border-radius:2px;
    background:var(--sand);
    margin-top:1px;
    box-shadow:0 0 6px rgba(200,155,92,0.7);
  }
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(15,20,12,0.52);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
  }
  .modal-card{
    background:var(--paper);
    width:100%;
    max-width:440px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:22px 22px 0 0;
    padding:22px 20px 30px;
    box-shadow:0 -10px 34px rgba(15,20,12,0.22);
  }
  .modal-title{
    font-family:'Oswald',sans-serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.2px;
    color:var(--green-deep);
    margin:0 0 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .field{margin-bottom:15px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 13px;
    font-size:14px;
    font-family:'Noto Sans KR',sans-serif;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;
    border-color:var(--green-mid);
    box-shadow:0 0 0 3px rgba(47,111,82,0.12);
  }
  .field textarea{resize:vertical; min-height:92px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .btn-primary{
    width:100%;
    background:var(--green-mid);
    color:#fff;
    border:none;
    border-radius:11px;
    padding:14px;
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    margin-top:8px;
    box-shadow:0 4px 14px rgba(47,111,82,0.28);
    transition:background .15s ease, transform .1s ease;
    position:relative;
    overflow:hidden;
  }
  .btn-primary:hover{background:var(--green-mid-hover);}
  .btn-primary:active{transform:scale(0.99);}
  .btn-secondary{
    width:100%;
    background:none;
    border:1.5px solid var(--green-mid);
    color:var(--green-mid);
    border-radius:11px;
    padding:12.5px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    margin-top:10px;
    position:relative;
    overflow:hidden;
  }
  .btn-danger-text{
    width:100%;
    background:none;
    border:none;
    color:var(--flag);
    padding:11px;
    font-size:13px;
    cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    margin-top:6px;
  }
  .participant-chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:var(--green-soft);
    color:var(--green-deep);
    border-radius:22px;
    padding:5px 12px 5px 5px;
    font-size:13px;
    margin:0 6px 7px 0;
    position:relative;
    overflow:hidden;
  }
  .score-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px dashed var(--border);
    gap:10px;
    flex-wrap:wrap;
    row-gap:8px;
  }
  .score-row:last-child{border-bottom:none;}
  .score-row .name-wrap{display:flex; align-items:center; gap:9px; font-size:14px; min-width:0;}
  .score-row input{
    width:66px;
    text-align:center;
    border:1px solid var(--border);
    border-radius:9px;
    padding:8px;
    font-family:'Roboto Mono',monospace;
    font-size:14px;
    flex-shrink:0;
  }
  .winner-tag{
    font-size:10px;
    background:var(--sand-bg);
    color:#7A551C;
    padding:2px 7px;
    border-radius:10px;
    margin-left:6px;
    font-weight:500;
    white-space:nowrap;
  }
  .loading{
    text-align:center;
    padding:64px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .photo-upload{
    position:relative;
    width:84px; height:84px;
    border-radius:50%;
    background:var(--green-mid);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .photo-upload .photo-initials{
    color:#fff; font-family:'Oswald',sans-serif; font-size:28px; font-weight:600;
  }
  .photo-upload img{
    width:84px; height:84px; border-radius:50%; object-fit:cover;
  }
  .photo-upload-badge{
    position:absolute; right:-2px; bottom:-2px;
    width:28px; height:28px; border-radius:50%;
    background:var(--green-deep);
    display:flex; align-items:center; justify-content:center;
    border:3px solid var(--paper);
  }
  .photo-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:7px;
    margin:2px 0 16px;
  }
  .photo-thumb{
    position:relative;
    aspect-ratio:1;
    border-radius:9px;
    overflow:hidden;
    background:var(--border);
    cursor:pointer;
  }
  .photo-thumb img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-add-tile{
    aspect-ratio:1;
    border-radius:9px;
    border:1.5px dashed var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-soft);
    cursor:pointer;
    background:var(--paper-card);
  }

  .glint-sweep{
    position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.55) 45%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0.55) 55%, transparent 100%);
    transform:skewX(-20deg);
    pointer-events:none;
    left:-60%;
    transition:left .55s cubic-bezier(.4,0,.2,1);
    border-radius:inherit;
    mix-blend-mode:overlay;
  }
  .glint-sweep.run{ left:120%; }
  .sparkle-burst{ position:fixed; width:0; height:0; z-index:500; pointer-events:none; }
  .spark{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background:radial-gradient(circle, #fff 0%, var(--sand) 60%, transparent 100%);
    opacity:0;
    animation:sparkOut .55s ease-out forwards;
  }
  @keyframes sparkOut{
    0%{ opacity:0; transform:translate(0,0) scale(0.3); }
    25%{ opacity:1; }
    100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(1); }
  }
</style>
</head>

function fmtDate(d){

function canvasToBlob(canvas, quality){
  return new Promise(resolve=> canvas.toBlob(resolve, 'image/jpeg', quality));

async function uploadPhotoToStorage(blob, folder){
  const fileName = folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';

      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'image/jpeg',
      'x-upsert': 'false'
    },
    body: blob
  });
  if(!res.ok){
    let detail = '';
    try{ detail = await res.text(); }catch(e){}
    throw new Error('업로드 실패 (' + res.status + ') ' + detail);
  }
  return SUPABASE_URL + '/storage/v1/object/public/photos/' + fileName;
}

function resizeImageFile(file, size){
  size = size || 160;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = async ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide)/2;
        const sy = (img.height - minSide)/2;
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        const blob = await canvasToBlob(canvas, 0.78);
        resolve(blob);
      };
      img.onerror = ()=>reject(new Error('image load failed'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}
async function handlePhotoSelect(e, previewId, initId){

  try{
    const blob = await resizeImageFile(file);

    const img = document.getElementById(previewId);
    img.src = url;
    img.dataset.photo = url;
    img.style.display = 'block';
    const init = document.getElementById(initId);

    console.error('photo upload failed', err);
    alert('사진 업로드 실패: ' + (err && (err.message || err.error_description || JSON.stringify(err))));
  }
}

async function safeGet(key, shared, fallback){
  if(!shared){
    try{
      const v = localStorage.getItem(key);
      return v!=null ? JSON.parse(v) : fallback;
    }catch(e){ return fallback; }
  }
  try{
    const { data, error } = await sb.from('app_storage').select('value').eq('key', key).maybeSingle();
    if(error || !data) return fallback;
    return data.value;
  }catch(e){ return fallback; }
}
async function safeSet(key, value, shared){
  if(!shared){
    try{
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    }catch(e){
      alert('저장에 실패했어요. 잠시 후 다시 시도해주세요.');
      return false;
    }
  }
  try{
    const { error } = await sb.from('app_storage').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error){ alert('저장에 실패했어요. 잠시 후 다시 시도해주세요.'); return false; }
    return true;
  }catch(e){
    alert('저장에 실패했어요. 잠시 후 다시 시도해주세요.');
    return false;
  }
}

function triggerFx(el, evt){
  if(!el) return;
  const sweep = document.createElement('span');
  sweep.className = 'glint-sweep';
  el.appendChild(sweep);
  requestAnimationFrame(()=> sweep.classList.add('run'));
  setTimeout(()=> sweep.remove(), 650);

  const x = evt && evt.clientX ? evt.clientX : (el.getBoundingClientRect().left + el.offsetWidth/2);
  const y = evt && evt.clientY ? evt.clientY : (el.getBoundingClientRect().top + el.offsetHeight/2);
  const container = document.createElement('div');
  container.className = 'sparkle-burst';
  container.style.left = x+'px';
  container.style.top = y+'px';
  const count = 6;
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    s.className = 'spark';
    const angle = (Math.PI*2/count)*i + Math.random()*0.4;
    const dist = 16+Math.random()*14;
    s.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    s.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
    s.style.animationDelay = (Math.random()*0.06)+'s';
    container.appendChild(s);
  }
  document.body.appendChild(container);
  setTimeout(()=> container.remove(), 650);
}

function handicapHistory(name){
  const played = events.filter(e=> e.scores && e.scores[name]!=null).slice().sort((a,b)=>a.date.localeCompare(b.date));
  return played.map(e=>{
    const upTo = events.filter(x=> x.date <= e.date);
    return {date: e.date, hcp: calcHandicapFromEvents(upTo, name)};
  }).filter(pt=> pt.hcp!=null);
}

function handicapChartHtml(history){
  if(history.length===0){
    return `<p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 4px;">아직 핸디캡 기록이 없어요.</p>`;
  }
  if(history.length===1){
    const only = history[0];
    return `<p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 4px;">라운드가 더 쌓이면 추이 그래프가 표시돼요. (현재 핸디캡 ${only.hcp>0?'+':''}${only.hcp})</p>`;
  }
  const vals = history.map(h=>h.hcp);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const pad = (maxV-minV)===0 ? 1 : (maxV-minV)*0.18;
  const yMin = minV-pad, yMax = maxV+pad;
  const w = 300, h = 110, padX = 8, padY = 10;
  const innerW = w-padX*2, innerH = h-padY*2;
  const points = history.map((pt,i)=>{
    const x = padX + innerW * (i/(history.length-1));
    const y = padY + innerH * (1 - (pt.hcp-yMin)/(yMax-yMin));
    return {x, y, hcp:pt.hcp, date:pt.date};
  });
  const pathD = points.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const dots = points.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--green-mid)"/>`).join('');
  const first = history[0], last = history[history.length-1];
  return `
    <div style="margin:-6px 0 6px;">
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;">
        <path d="${pathD}" fill="none" stroke="var(--green-mid)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}
      </svg>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); font-family:'Roboto Mono',monospace; margin-top:2px;">
        <span>${fmtDate(first.date)} · ${first.hcp>0?'+':''}${first.hcp}</span>
        <span>${fmtDate(last.date)} · ${last.hcp>0?'+':''}${last.hcp}</span>
      </div>
    </div>`;
}

async function saveMemberProfile(mode, memberId){
  const name = document.getElementById('memberNameInput').value.trim();
  if(!name){ alert('이름을 입력해주세요.'); return; }
  const photo = document.getElementById('memberPhotoPreview').dataset.photo || null;

  if(mode==='new'){
    if(members.find(m=>m.name===name)){ alert('이미 등록된 이름이에요.'); return; }
    members.push({id:Date.now(), name, photo});
  } else {
    let m;
    if(mode==='self'){
      m = members.find(x=>x.name===myName);
      if(!m){ m = {id:Date.now(), name: myName || name, photo:null}; members.push(m); }
    } else {
      m = members.find(x=>x.id===memberId);
    }
    if(!m) return;
    const oldName = m.name;
    if(oldName !== name){
      if(members.find(x=>x!==m && x.name===name)){ alert('이미 사용 중인 이름이에요.'); return; }
      renameEverywhere(oldName, name);
      m.name = name;
      if(mode==='self'){ myName = name; }
    } else if(mode==='self'){
      myName = name;
    }
    m.photo = photo;
  }

  if(mode==='self'){ await safeSet('my-name', myName, false); updateIdentityDisplay(); }
  await safeSet('club-members', members, true);
  await safeSet('club-events', events, true);
  await safeSet('club-posts', posts, true);
  closeModal();
  render();
}

function openEventDetail(id){

  const isPast = e.date < todayStr();

    <p class="event-meta" style="margin:-10px 0 14px">${fmtDate(e.date)} · 파 ${e.par} · ${e.participants.length}/${e.max}명</p>

    <div style="margin-bottom:14px">${chips}</div>

      ${achievementRows}

      <div class="divider-label">스코어카드 사진</div>
      <p style="font-size:12px;color:var(--ink-soft);margin:-6px 0 10px;line-height:1.5;">홀별 스코어는 수기 스코어카드나 카트 스마트스코어 화면을 찍어서 남겨두세요.</p>

async function deletePhoto(eventId, kind, index){
  if(!confirm('이 사진을 삭제할까요?')) return;
  const ev = events.find(x=>x.id===eventId);
  if(!ev) return;
  const arrKey = kind==='scorecard' ? 'scorecardPhotos' : 'memoryPhotos';
  if(!ev[arrKey]) return;
  ev[arrKey].splice(index,1);
  const ok = await safeSet('club-events', events, true);
  if(ok) openEventDetail(eventId);
}

function resizeImagePreserveAspect(file, maxDim, quality){
  maxDim = maxDim || 640;
  quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = async ()=>{
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w*scale));
        h = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const blob = await canvasToBlob(canvas, quality);
        resolve(blob);
      };
      img.onerror = ()=>reject(new Error('image load failed'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=>reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

async function handleGalleryFilesSelect(e, eventId, kind){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  const ev = events.find(x=>x.id===eventId);
  if(!ev) return;
  const arrKey = kind==='scorecard' ? 'scorecardPhotos' : 'memoryPhotos';
  if(!ev[arrKey]) ev[arrKey] = [];
  const maxCount = kind==='memory' ? 8 : 12;
  const remaining = maxCount - ev[arrKey].length;
  if(remaining<=0){
    alert(kind==='memory' ? '추억 사진은 최대 8장까지 올릴 수 있어요.' : '스코어카드 사진은 최대 12장까지 올릴 수 있어요.');
    e.target.value = '';
    return;
  }
  const toProcess = files.slice(0, remaining);
  if(files.length > toProcess.length){
    alert('최대 개수를 넘어 일부 사진만 추가돼요.');
  }
  for(const f of toProcess){
    try{
      const blob = await resizeImagePreserveAspect(f, kind==='memory'?640:900, kind==='memory'?0.72:0.75);
      const url = await uploadPhotoToStorage(blob, kind==='memory' ? 'memories' : 'scorecards');
      ev[arrKey].push(url);
    }catch(err){
      console.error('gallery photo upload failed', err);
      alert('사진 업로드 실패: ' + (err && (err.message || err.error_description || JSON.stringify(err))));
    }
  }
  const ok = await safeSet('club-events', events, true);
  e.target.value = '';
  if(ok) openEventDetail(eventId);
}

async function toggleJoin(id){
  const e = events.find(x=>x.id===id);
  if(!e || !myName) return;
  const idx = e.participants.indexOf(myName);
  if(idx>=0) e.participants.splice(idx,1);
  else e.participants.push(myName);
  const ok = await safeSet('club-events', events, true);
  if(ok) openEventDetail(id);
}

async function toggleAchievement(eventId, name, type, btn){
  const ev = events.find(x=>x.id===eventId);
  if(!ev) return;
  if(!ev.achievements) ev.achievements = {};
  if(!ev.achievements[name]) ev.achievements[name] = [];
  const idx = ev.achievements[name].indexOf(type);
  if(idx>=0){ ev.achievements[name].splice(idx,1); btn.classList.remove('active'); }
  else { ev.achievements[name].push(type); btn.classList.add('active'); }
  await safeSet('club-events', events, true);
}

async function saveEventDetails(id){
  const e = events.find(x=>x.id===id);
  if(!e) return;
  const inputs = document.querySelectorAll('#modalRoot .score-row input');
  inputs.forEach(inp=>{
    const name = inp.dataset.name;
    const val = inp.value.trim();
    if(val==='') delete e.scores[name];
    else e.scores[name] = parseInt(val);
  });
  const longestSel = document.getElementById('longestSel');
  const nearestSel = document.getElementById('nearestSel');
  e.longest = longestSel ? (longestSel.value || null) : null;
  e.nearest = nearestSel ? (nearestSel.value || null) : null;
  const ok = await safeSet('club-events', events, true);
  if(ok){ closeModal(); render(); }
}

async function deleteEvent(id){
  if(!confirm('이 라운드를 삭제할까요? 기록된 스코어도 함께 사라져요.')) return;
  events = events.filter(x=>x.id!==id);
  const ok = await safeSet('club-events', events, true);
  if(ok){ closeModal(); render(); }
}

function calcHandicapFromEvents(eventsList, name){
  const diffs = eventsList.filter(e=> e.scores && e.scores[name]!=null).map(e=> e.scores[name] - (e.par||72));
  if(diffs.length===0) return null;
  diffs.sort((a,b)=>a-b);
  const useCount = Math.max(1, Math.ceil(diffs.length*0.4));
  const best = diffs.slice(0, useCount);
  const avg = best.reduce((a,b)=>a+b,0)/best.length;
  return Math.round(avg*0.8*10)/10;
}
function calcHandicap(name){
  return calcHandicapFromEvents(events, name);
}

function memberStats(name){
  const played = events.filter(e=> e.scores && e.scores[name]!=null);
  const rounds = played.length;
  const avgScore = rounds>0 ? Math.round(played.reduce((s,e)=>s+e.scores[name],0)/rounds*10)/10 : null;
  const longestCount = events.filter(e=>e.longest===name).length;
  const nearestCount = events.filter(e=>e.nearest===name).length;
  const hcp = calcHandicap(name);
  return {rounds, avgScore, longestCount, nearestCount, hcp};
}

let hofYear = null;

function currentRankingHtml(){
  let html = `<div class="note-box">간이 핸디캡은 각 라운드 스코어와 파의 차이 중 상위 40% 라운드를 평균낸 참고용 수치예요. 라운드 기록이 있어야 계산돼요.</div>`;

  });

  return html;

function hallOfFameHtml(years){
  if(years.length===0){
    return `<div class="empty-state"><p>아직 스코어가 기록된 라운드가 없어요.<br>라운드를 기록하면 연간 아카이브가 여기 쌓여요.</p></div>`;
  }
  const yearOptions = years.map(y=>`<option value="${y}" ${y===hofYear?'selected':''}>${y}년</option>`).join('');
  let html = `<div class="field"><select onchange="setHofYear(this.value)">${yearOptions}</select></div>`;

  const yearEvents = events.filter(e=> e.date.slice(0,4)===hofYear && e.scores);
  const archiveRows = members.map(m=>{
    const played = yearEvents.filter(e=> e.scores[m.name]!=null);
    if(played.length===0) return null;
    const total = played.reduce((s,e)=>s+e.scores[m.name],0);
    const avg = Math.round(total/played.length*10)/10;
    return {name:m.name, photo:m.photo, rounds:played.length, avg, total};
  }).filter(Boolean).sort((a,b)=>a.avg-b.avg);

  html += `<div class="divider-label">${hofYear}년 회원별 평균 타수</div>`;
  if(archiveRows.length===0){
    html += `<div class="note-box">${hofYear}년에 기록된 스코어가 없어요.</div>`;
  }else{
    archiveRows.forEach(r=>{
      html += `<div class="rank-row">
        ${avatarHtml(r.name, r.photo, 34)}
        <div class="rank-info">
          <p class="rank-name">${esc(r.name)}</p>
          <p class="rank-stats">${r.rounds}라운드 · 합산 ${r.total}타</p>
        </div>
        <div class="rank-hcp">
          <div class="num">${r.avg}</div>
          <div class="lbl">평균타수</div>
        </div>
      </div>`;
    });
  }

  html += `<div class="divider-label">${hofYear}년 명예의 전당</div>`;
  html += hofAwardsHtml(hofYear, yearEvents, archiveRows);
  return html;
}

function hofAwardsHtml(year, yearEvents, archiveRows){
  let poy = null;
  archiveRows.forEach(r=>{ if(!poy || r.total < poy.total) poy = r; });

  const yearStart = year+'-01-01';
  const yearEnd = year+'-12-31';
  let mostImproved = null;
  members.forEach(m=>{
    const beforeEvents = events.filter(e=> e.date < yearStart);
    const throughEvents = events.filter(e=> e.date <= yearEnd);
    const startHcp = calcHandicapFromEvents(beforeEvents, m.name);
    const endHcp = calcHandicapFromEvents(throughEvents, m.name);
    if(startHcp!=null && endHcp!=null){
      const improvement = Math.round((startHcp-endHcp)*10)/10;
      if(improvement>0 && (!mostImproved || improvement>mostImproved.improvement)){
        mostImproved = {name:m.name, photo:m.photo, improvement, startHcp, endHcp};
      }
    }
  });

  function specialWinner(type){
    const counts = {};
    yearEvents.forEach(e=>{
      if(!e.achievements) return;
      Object.keys(e.achievements).forEach(name=>{
        if(e.achievements[name].includes(type)) counts[name]=(counts[name]||0)+1;
      });
    });
    const names = Object.keys(counts);
    if(names.length===0) return null;
    const max = Math.max(...names.map(n=>counts[n]));
    return {names: names.filter(n=>counts[n]===max), count:max};
  }
  const eagleW = specialWinner('eagle');
  const albatrossW = specialWinner('albatross');
  const hioW = specialWinner('holeInOne');

  const card = (title, sub, contentHtml)=>`
    <div class="hof-card">
      <div class="hof-title">${title}${sub? `<span class="hof-sub">${sub}</span>`:''}</div>
      ${contentHtml}
    </div>`;
  const personRow = (name, photo, sub)=>`
    <div style="display:flex; align-items:center; gap:10px; margin-top:9px;">
      ${avatarHtml(name, photo, 36)}
      <div><p style="font-size:14.5px;font-weight:500;margin:0;">${esc(name)}</p><p style="font-size:12px;color:var(--ink-soft);margin:2px 0 0;">${sub}</p></div>
    </div>`;
  const empty = `<p style="font-size:12.5px;color:var(--ink-soft);margin-top:9px;">해당자 없음</p>`;

  let html = '';
  html += card('올해의 회원', '연간 합산 최저타수', poy? personRow(poy.name, poy.photo, poy.total+'타 · '+poy.rounds+'라운드') : empty);
  html += card('핸디캡 최다 개선상', null, mostImproved? personRow(mostImproved.name, mostImproved.photo, (mostImproved.startHcp>0?'+':'')+mostImproved.startHcp+' → '+(mostImproved.endHcp>0?'+':'')+mostImproved.endHcp+' · 개선폭 '+mostImproved.improvement) : empty);
  html += card('이글 기록자', null, eagleW? eagleW.names.map(n=>personRow(n, memberPhoto(n), eagleW.count+'회')).join('') : empty);
  html += card('알바트로스 기록자', null, albatrossW? albatrossW.names.map(n=>personRow(n, memberPhoto(n), albatrossW.count+'회')).join('') : empty);
  html += card('홀인원 기록자', null, hioW? hioW.names.map(n=>personRow(n, memberPhoto(n), hioW.count+'회')).join('') : empty);
  return html;
}

        <p class="post-meta">${avatarHtml(p.author, memberPhoto(p.author), 18)}${esc(p.author)} · ${fmtDate(p.date)}</p>
        <p class="post-preview">${esc(preview)}</p>
      </div>`;
    });
  }
  el.innerHTML = html;
}

function openPostForm(){
  if(!myName){ openMemberProfileModal('self', null); return; }
  openModal(`
    <div class="modal-title">글쓰기
      <button class="icon-btn" style="color:var(--ink-soft)" onclick="closeModal()">✕</button>
    </div>
    <div class="field"><label>제목</label><input type="text" id="postTitle" placeholder="제목을 입력하세요"></div>
    <div class="field"><label>내용</label><textarea id="postContent" placeholder="내용을 입력하세요"></textarea></div>
    <button class="btn-primary" onclick="saveNewPost()">등록하기</button>
  `);
}
async function saveNewPost(){
  const title = document.getElementById('postTitle').value.trim();
  const content = document.getElementById('postContent').value.trim();
  if(!title || !content){ alert('제목과 내용을 입력해주세요.'); return; }
  posts.push({id:Date.now(), title, content, author:myName, date:todayStr()});
  const ok = await safeSet('club-posts', posts, true);
  if(ok){ closeModal(); render(); }
}

function openPostDetail(id){
  const p = posts.find(x=>x.id===id);
  if(!p) return;
  const canDelete = myName===p.author;
  openModal(`
    <div class="modal-title">${esc(p.title)}
      <button class="icon-btn" style="color:var(--ink-soft)" onclick="closeModal()">✕</button>
    </div>
    <p class="post-meta" style="margin-top:-10px">${avatarHtml(p.author, memberPhoto(p.author), 18)}${esc(p.author)} · ${fmtDate(p.date)}</p>
    <p style="font-size:14px; line-height:1.7; white-space:pre-wrap;">${esc(p.content)}</p>
    ${canDelete? `<button class="btn-danger-text" onclick="deletePost(${id})">삭제하기</button>` : ''}
  `);
}
async function deletePost(id){
  if(!confirm('이 글을 삭제할까요?')) return;
  posts = posts.filter(x=>x.id!==id);
  const ok = await safeSet('club-posts', posts, true);
  if(ok){ closeModal(); render(); }
}

init();
</script>
</body>
</html>
